        <div class="ask-actions">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../supabase.js"></script>
    <script src="../site.js"></script>
    <script>
      (function () {
        /* Categories live in three places: CATS here, admin select#dr-cat, admin DRESS_CATS. */
        var CATS = [{ key: 'hair', label: '헤어' }, { key: 'outfit', label: '의상' }, { key: 'lens', label: '렌즈' }];
        var LABELS = {};
        CATS.forEach(function (c) { LABELS[c.key] = c.label; });
        var PER_PAGE = 9;
        var BRAND = 'UCHI';

        var allItems = [], curCat = CATS[0].key, curMode = 'new', curPage = 1, pageItems = [];

        function ready() { document.body.classList.add('ready'); fitShell(); }

        function isNew(it) {
          return (it.badges || []).some(function (b) {
            var label = (b && (b.label != null ? b.label : b)) || '';
            return String(label).trim().toUpperCase() === 'NEW';
          });
        }

        function viewItems() {
          if (curMode === 'new') {
            return allItems.filter(function (i) { return i.category === curCat && isNew(i); })
              .slice().sort(function (a, b) { return new Date(b.created_at || 0) - new Date(a.created_at || 0); });
          }
          return allItems.filter(function (i) { return i.category === curCat && !isNew(i); });
        }

        function buildTabs() {
          var wrap = document.getElementById('cat-tabs');
          wrap.innerHTML = '';
          CATS.forEach(function (c) {
            var cnt = allItems.filter(function (i) {
              return i.category === c.key && (curMode === 'new' ? isNew(i) : !isNew(i));
            }).length;
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'cat-tab' + (c.key === curCat ? ' active' : '');
            b.innerHTML = esc(c.label) + ' <span class="cnt">' + cnt + '</span>';
            b.onclick = function () { curCat = c.key; curPage = 1; buildTabs(); render(); };
            wrap.appendChild(b);
          });
        }

        function posterHTML(items) {
          return '<div class="poster-grid">' + items.map(function (it, idx) {
            var img = it.image_url
              ? '<img src="' + esc(it.image_url) + '" referrerpolicy="no-referrer" alt="' + esc(it.name) + '" loading="lazy">'
              : '<span class="ph-ph">👗</span>';
            var cat = LABELS[it.category] ? '<span class="p-cat">' + esc(LABELS[it.category]) + '</span>' : '';
            var date = it.created_at ? '<div class="p-meta">' + fmtDate(it.created_at) + '</div>' : '';
            return '<div class="poster' + (it.image_url ? '' : ' no-img') + '" data-idx="' + idx + '">' + img +
              '<div class="p-top"><span class="p-brand">' + BRAND + '</span><span class="p-new">✦ NEW</span></div>' +
              '<div class="p-bottom">' + cat + '<div class="p-name">' + esc(it.name) + '</div>' + date +
              (it.description ? '<div class="p-desc">' + esc(it.description) + '</div>' : '') +
              '</div></div>';
          }).join('') + '</div>';
        }

        function gridHTML(items) {
          return '<div class="item-grid">' + items.map(function (it, idx) {
            var inner = it.image_url
              ? '<img src="' + esc(it.image_url) + '" referrerpolicy="no-referrer" alt="' + esc(it.name) + '" loading="lazy">'
              : '<span class="ph">👗</span>';
            return '<div class="item-card' + (it.image_url ? '' : ' no-img') + '" data-idx="' + idx + '">' + inner +
              '<div class="item-cap"><div class="name">' + esc(it.name) + '</div>' +
              (it.description ? '<div class="desc">' + esc(it.description) + '</div>' : '') + '</div></div>';
          }).join('') + '</div>';
        }

        function render() {
          var body = document.getElementById('dress-body');
          var items = viewItems();
          if (!items.length) {
            body.innerHTML = '<div class="empty"><span class="empty-icon">👗</span>' +
              (curMode === 'new'
                ? esc(LABELS[curCat] || '') + ' 새 옷이 아직 없어요<br><span class="empty-sub">관리자에서 옷을 올릴 때 "새 옷으로 올리기"를 체크하면 포스터로 나옵니다</span>'
                : esc(LABELS[curCat] || '') + ' 항목이 아직 없어요') + '</div>';
            fitShell();
            return;
          }
          var totalPages = Math.max(1, Math.ceil(items.length / PER_PAGE));
          if (curPage > totalPages) curPage = 1;
          pageItems = items.slice((curPage - 1) * PER_PAGE, curPage * PER_PAGE);
          var main = (curMode === 'new') ? posterHTML(pageItems) : gridHTML(pageItems);
          var pager = '';
          if (totalPages > 1) {
            pager = '<div class="dress-pager">';
            for (var i = 1; i <= totalPages; i++) {
              pager += '<button class="pg' + (i === curPage ? ' active' : '') + '" type="button" data-pg="' + i + '">' + i + '</button>';
            }
            pager += '</div>';
          }
          body.innerHTML = main + pager;
          body.querySelectorAll('[data-idx]').forEach(function (el) {
            el.addEventListener('click', function () {
              var it = pageItems[Number(el.dataset.idx)];
              if (it && it.image_url) openLb(it);
            });
          });
          body.querySelectorAll('.pg').forEach(function (btn) {
            btn.addEventListener('click', function () { curPage = Number(btn.dataset.pg); render(); window.scrollTo(0, 0); });
          });
          enableIframeAutoHeight();
          fitShell();
        }

        function openLb(item) {
          document.getElementById('lb-img').src = item.image_url;
          document.getElementById('lb-name').textContent = item.name || '';
          var d = document.getElementById('lb-desc');
          d.textContent = item.description || '';
          d.style.display = item.description ? 'block' : 'none';
          var lb = document.getElementById('lightbox');
          lb.classList.add('open');
          placeOverlay(lb);
        }
        window.closeLb = function () { document.getElementById('lightbox').classList.remove('open'); };

        document.getElementById('lightbox').addEventListener('click', function (e) {
          if (e.target.id === 'lightbox') closeLb();
        });

        async function load() {
          try {
            allItems = await fetchAll('dress_items', { order: 'sort_order', asc: true });
          } catch (e) { allItems = []; }
          document.querySelectorAll('#mode-seg .seg-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
              curMode = btn.dataset.mode;
              curPage = 1;
              document.querySelectorAll('#mode-seg .seg-btn').forEach(function (b) {
                b.classList.toggle('active', b.dataset.mode === curMode);
              });
              buildTabs();
              render();
            });
          });
          buildTabs();
          render();
        }

        window.profileData.then(function (d) {
          if (typeof d['info-reading'] === 'string' && d['info-reading'].trim()) {
            var parts = d['info-reading'].split('/');
            BRAND = (parts[parts.length - 1] || BRAND).trim().toUpperCase();
          }
        });

        wireHeading('dress');
        load().catch(function () { }).then(ready, ready);
        setTimeout(ready, 1200);
      })();
    </script>
    <script src="../fx.js"></script>
    <script>
      (function () {
        var a = document.getElementById('navSoop');
        if (!a || typeof window.fxHearts !== 'function') return;
        a.addEventListener('click', function (e) { window.fxHearts(e.clientX, e.clientY, 8); });
      })();
    </script>

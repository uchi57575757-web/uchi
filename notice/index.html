  <body>

    <div class="fit-outer" id="fitOuter">
      <div class="fit-inner" id="fitInner">
        <main class="page-shell page-shell--sub wrap">
          <header class="topbar" aria-label="메인 메뉴">
            <div class="topbar-actions">
              <a class="square-button square-button--dark" id="navSoop" href="https://www.sooplive.com/station/uchi5757" target="_blank" rel="noreferrer" aria-label="우치 SOOP 방송국">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="8" r="3.3" />
                  <path d="M5.2 20c.5-4.4 2.8-6.7 6.8-6.7s6.3 2.3 6.8 6.7" />
                </svg>
                <img class="nav-av" id="navAvatar" src="../assets/av-nav.gif" alt="" referrerpolicy="no-referrer" />

              <button class="square-button square-button--light" id="dkbox" type="button" aria-label="다크 모드" title="다크 모드">

    <div class="askmask" id="askmask" aria-hidden="true">
      <div class="askmodal" role="dialog" aria-modal="true" aria-label="문의하기">
        <h3>문의하기</h3>
        <p class="hint">남긴 내용은 관리자만 확인합니다.</p>
        <div class="form-field">
          <input class="input" id="asknick" placeholder="닉네임 (선택)" maxlength="20" />
        </div>
        <textarea class="input" id="askmsg" rows="5" placeholder="문의 내용"></textarea>
        <div class="ask-actions">
          <button class="btn" type="button" onclick="closeAsk()">닫기</button>
          <button class="btn btn-primary" type="button" onclick="sendAsk()">보내기</button>
        </div>
      </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../supabase.js"></script>
    <script src="../site.js"></script>
    <script>
      (function () {
        function ready() { document.body.classList.add('ready'); fitShell(); }

        async function init() {
          var el = document.getElementById('notice-list');
          var data = [];
          try { data = await fetchAll('notice', { order: 'created_at', asc: false }); } catch (e) { data = []; }
          var all = data.filter(function (n) { return n.pinned; })
            .concat(data.filter(function (n) { return !n.pinned; }));
          document.getElementById('count').textContent = '총 ' + all.length + '개의 공지';
          if (!all.length) {
            el.innerHTML = '<div class="empty"><span class="empty-icon">✦</span>아직 올라온 공지가 없어요</div>';
            return;
          }
          el.innerHTML = all.map(function (n) {
            var d = new Date(n.created_at);
            var dateStr = isNaN(d) ? '' : d.getFullYear() + '.' +
              String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
            var imgs = (n.images && n.images.length) ? n.images : (n.image_url ? [n.image_url] : []);
            return '<div class="notice-item' + (n.pinned ? ' pinned' : '') + '">' +
              (n.pinned ? '<span class="notice-pin">고정</span>' : '<span></span>') +
              '<span class="notice-title">' + esc(n.title) + '</span>' +
              '<span class="notice-date">' + dateStr + '</span>' +
              '<div class="notice-content">' +
              imgs.map(function (u) {
                return '<img src="' + esc(u) + '" class="post-img" referrerpolicy="no-referrer" loading="lazy" alt="">';
              }).join('') +
              esc(n.content || '').replace(/\n/g, '<br>') + '</div></div>';
          }).join('');
          el.querySelectorAll('.notice-item').forEach(function (item) {
            item.addEventListener('click', function () {
              item.classList.toggle('open');
              enableIframeAutoHeight();
              fitShell();
            });
          });
        }

        wireHeading('notice');
        init().catch(function () { }).then(ready, ready);
        setTimeout(ready, 1200);
      })();
    </script>
    <script src="../fx.js"></script>
    <script>
      (function () {
        var a = document.getElementById('navSoop');
        if (!a || typeof window.fxHearts !== 'function') return;
        a.addEventListener('click', function (e) { window.fxHearts(e.clientX, e.clientY, 8); });
      })();
    </script>
  </body>
</html>

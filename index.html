    <script>
      /* Main page loader. Keys must exist in admin GROUPS — see README. */
      (function () {
        var TEXT = ['main-title', 'main-quick-title', 'main-week-title'];
        var HTMLKEYS = ['main-lead', 'main-cap-profile', 'main-cap-notice', 'main-cap-dress'];
        var IMAGES = ['main-hero', 'main-photo-1', 'main-photo-2'];
        var LINKS = ['link-etc', 'link-cafe', 'link-youtube', 'link-soop', 'link-fansim'];

        function ready() { document.body.classList.add('ready'); fitShell(); }

        renderWeekRows('week-rows', WEEK_DEFAULT);

        window.profileData.then(function (d) {
          TEXT.forEach(function (k) {
            var el = document.getElementById(k);
            if (el && typeof d[k] === 'string' && d[k].trim()) el.textContent = d[k].trim();
          });
          HTMLKEYS.forEach(function (k) {
            var el = document.getElementById(k);
            if (el && typeof d[k] === 'string' && d[k].trim()) el.innerHTML = esc(d[k].trim()).replace(/\n/g, '<br>');
          });
          IMAGES.forEach(function (k) {
            var el = document.getElementById(k);
            if (el && typeof d[k] === 'string' && d[k].trim()) el.src = d[k].trim();
          });
          LINKS.forEach(function (k) {
            var a = document.getElementById(k);
            if (!a) return;
            if (typeof d[k] === 'string' && d[k].trim()) { a.href = d[k].trim(); a.hidden = false; }
            else if (!a.getAttribute('href') || a.getAttribute('href') === '#') a.hidden = true;
          });
          renderWeekRows('week-rows', typeof d['week-schedule'] === 'string' && d['week-schedule'].trim()
            ? d['week-schedule'] : WEEK_DEFAULT);
        }).catch(function () { }).then(ready, ready);

        setTimeout(ready, 1600);
      })();
    </script>

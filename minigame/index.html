    <script>
      (function () {
        var DEFAULT_LIST = '마인크래프트\n리그 오브 레전드\n소통\n풀트\n종합게임';
        var LOG_KEY = 'uchi-mg-log';
        var OPTS = [], COLORS = [], PICKED = null;
        var rot = 0, spinning = false;

        var cv = document.getElementById('wheel');
        var ctx = cv.getContext('2d');
        var S = cv.width;                       /* backing store is 2x the CSS size */

        function ready() { document.body.classList.add('ready'); fitShell(); }

        function cssVar(n, fb) {
          var v = getComputedStyle(document.body).getPropertyValue(n).trim();
          return v || fb;
        }

        function buildColors(n) {
          var pal = [cssVar('--main', '#fd8495'), cssVar('--sub', '#f9b7ba'),
                     cssVar('--main-light', '#ffe8e7'), cssVar('--main-dark', '#fa7186')];
          var out = [];
          for (var i = 0; i < n; i++) {
            var c = pal[i % pal.length];
            if (n > 1 && i === n - 1 && c === out[0]) c = pal[1];
            out.push(c);
          }
          return out;
        }

        function drawWheel() {
          var n = OPTS.length;
          ctx.clearRect(0, 0, S, S);
          if (!n) return;
          var seg = Math.PI * 2 / n, R = S / 2, cx = R, cy = R;
          for (var i = 0; i < n; i++) {
            var a0 = i * seg + rot, a1 = a0 + seg;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, R - 6, a0, a1);
            ctx.closePath();
            ctx.fillStyle = COLORS[i];
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,.85)';
            ctx.lineWidth = 4;
            ctx.stroke();

            var mid = a0 + seg / 2;
            var label = OPTS[i];
            if (label.length > 11) label = label.slice(0, 10) + '…';
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(mid);
            ctx.fillStyle = '#3f3a40';
            ctx.font = '700 30px "Pretendard Variable", Pretendard, "Noto Sans KR", sans-serif';
            ctx.textBaseline = 'middle';
            if (Math.cos(mid) < 0) {          /* left half: flip so the label is not upside down */
              ctx.rotate(Math.PI);
              ctx.textAlign = 'left';
              ctx.fillText(label, -(R - 34), 0);
            } else {
              ctx.textAlign = 'right';
              ctx.fillText(label, R - 34, 0);
            }
            ctx.restore();
          }
        }

        /* The winner is drawn uniformly first, then the wheel is rotated so that
           segment sits under the pin — the animation never decides the result. */
        function targetRotFor(k) {
          var n = OPTS.length, seg = Math.PI * 2 / n;
          var jitter = (Math.random() - 0.5) * seg * 0.7;
          var want = -Math.PI / 2 - (k * seg + seg / 2) + jitter;
          var turns = 5 + Math.floor(Math.random() * 3);
          var base = rot % (Math.PI * 2);
          var delta = ((want - base) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
          return rot + turns * Math.PI * 2 + delta;
        }

        function spin() {
          if (spinning || !OPTS.length) return;
          if (OPTS.length === 1) { finish(0); return; }
          spinning = true;
          document.getElementById('spin').disabled = true;
          var k = Math.floor(Math.random() * OPTS.length);
          var from = rot, to = targetRotFor(k), t0 = performance.now(), dur = 3800;
          (function step(now) {
            var p = Math.min(1, (now - t0) / dur);
            var e = 1 - Math.pow(1 - p, 3);
            rot = from + (to - from) * e;
            drawWheel();
            if (p < 1) requestAnimationFrame(step);
            else { spinning = false; document.getElementById('spin').disabled = false; finish(k); }
          })(t0);
        }

        function finish(k) {
          PICKED = OPTS[k];
          var box = document.getElementById('wheel-result');
          box.classList.remove('idle');
          box.innerHTML = '<small>RESULT</small><b>' + esc(PICKED) + '</b>';
          if (typeof window.fxHearts === 'function') {
            var r = box.getBoundingClientRect();
            window.fxHearts(r.left + r.width / 2, r.top + r.height / 2, 12);
          }
          pushLog(PICKED);
        }

        function pushLog(v) {
          var list = readLog();
          list.unshift({ v: v, t: Date.now() });
          list = list.slice(0, 8);
          try { localStorage.setItem(LOG_KEY, JSON.stringify(list)); } catch (e) { }
          renderLog(list);
        }
        function readLog() {
          try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch (e) { return []; }
        }
        function renderLog(list) {
          var el = document.getElementById('mg-log');
          if (!list.length) { el.innerHTML = '<div class="empty">아직 돌린 결과가 없어요</div>'; return; }
          el.innerHTML = list.map(function (r) {
            var d = new Date(r.t);
            var hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
            return '<div><b>' + esc(r.v) + '</b><span>' + hm + '</span></div>';
          }).join('');
        }

        function renderList() {
          document.getElementById('mg-list').innerHTML = OPTS.length
            ? OPTS.map(function (o, i) {
                return '<div class="mg-item"><i style="background:' + COLORS[i] + '"></i>' + esc(o) + '</div>';
              }).join('')
            : '<div class="empty">항목이 아직 없어요</div>';
        }

        function apply(v) {
          OPTS = String(v == null ? '' : v).split('\n')
            .map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 16);
          COLORS = buildColors(OPTS.length);
          renderList();
          drawWheel();
        }

        document.getElementById('spin').addEventListener('click', spin);
        document.getElementById('copy').addEventListener('click', function () {
          if (!PICKED) { showToast('먼저 돌림판을 돌려 주세요'); return; }
          if (navigator.clipboard) navigator.clipboard.writeText(PICKED);
          showToast('결과를 복사했어요');
        });
        document.getElementById('dkbox').addEventListener('click', function () {
          setTimeout(function () { COLORS = buildColors(OPTS.length); renderList(); drawWheel(); }, 30);
        });

        apply(DEFAULT_LIST);
        renderLog(readLog());
        wireHeading('minigame');
        window.profileData.then(function (d) {
          if (typeof d['roulette-list'] === 'string' && d['roulette-list'].trim()) apply(d['roulette-list']);
        }).catch(function () { }).then(ready, ready);
        setTimeout(ready, 1200);
      })();
    </script>
    <script src="../fx.js"></script>
    <script>
      (function () {
        var a = document.getElementById('navSoop');
        if (!a || typeof window.fxHearts !== 'function') return;
        a.addEventListener('click', function (e) { window.fxHearts(e.clientX, e.clientY, 8); });
      })();
    </script>
